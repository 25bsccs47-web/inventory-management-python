<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inventory — Hyper UI</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container">
      <h1>Inventory — Hyper UI</h1>
      <div class="grid">
        <div class="panel">
          <h2>Items</h2>
          <table id="items-table">
            <thead><tr><th>ID</th><th>Name</th><th>Qty</th><th>Price</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="panel">
          <h2>Item Editor</h2>
          <label>Name <input id="name"/></label>
          <label>Quantity <input id="quantity" type="number"/></label>
          <label>Price <input id="price" type="number" step="0.01"/></label>
          <div class="buttons">
            <button id="add">Add</button>
            <button id="update">Update</button>
            <button id="delete">Delete</button>
            <button id="refresh">Refresh</button>
          </div>
          <div id="status" class="status"></div>
        </div>
      </div>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
